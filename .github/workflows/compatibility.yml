name: Consumer compatibility
on:
  workflow_dispatch:
jobs:
  consumer:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [excalidraw, state-in-url]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:compat --require-pass ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.project }}
          path: compatibility/reports/${{ matrix.project }}-linux.json
